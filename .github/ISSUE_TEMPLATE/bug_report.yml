name: Bug
description: 재현 가능한 오류를 보고합니다.
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 오류를 재현하는 입력과 단계를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      placeholder: 예: Windows 11, Node.js 22, Chrome
