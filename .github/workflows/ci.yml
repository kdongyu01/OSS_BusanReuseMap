name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Node ${{ matrix.node-version }} on ${{ matrix.os }}
    uses: ./.github/workflows/reusable-node-checks.yml
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]
    with:
      node-version: ${{ matrix.node-version }}
      runner: ${{ matrix.os }}
      npm-cache: true

  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.filter.outputs.app_changed }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect application changes
        id: filter
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^(src/|public/|package(-lock)?\.json$|vite\.config\.ts$|index\.html$)'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      CI_DEPLOY_MARKER: ${{ secrets.CI_DEPLOY_MARKER }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: ./.github/actions/setup-node-deps
        with:
          node-version: 22
          npm-cache: true

      - name: Build
        run: npm run build

      - name: Verify deployment secret is available
        if: env.CI_DEPLOY_MARKER != ''
        run: echo "Deployment secret is configured without exposing its value."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: dist/
          retention-days: 7

  deploy:
    needs: [build, changes]
    if: needs.changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
