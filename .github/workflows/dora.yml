name: DORA metrics

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  issues: read
  pull-requests: read
  deployments: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect DORA metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          DORA_DAYS: 30
          DORA_OUTPUT: artifacts/dora-report.json
        run: node scripts/collect-dora.mjs

      - name: Render dashboard
        env:
          DORA_INPUT: artifacts/dora-report.json
          DORA_HTML: artifacts/dora-dashboard.html
        run: node scripts/render-dora-dashboard.mjs

      - name: Render weekly report
        env:
          DORA_INPUT: artifacts/dora-report.json
          DORA_REPORT: artifacts/dora-weekly-report.md
        run: node scripts/render-dora-report.mjs

      - name: Upload DORA report
        uses: actions/upload-artifact@v4
        with:
          name: dora-report-${{ github.run_number }}
          path: artifacts/
          retention-days: 30
